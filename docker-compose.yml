# docker-compose.yml — dev 用 PostgreSQL + MinIO + stripe-mock を起動する。
# app 本体は `npm run dev` で直起動する前提 (hot reload 維持のため)。
# ポート 9002/9003 を使用 (ai-recruitment-manga の 9000/9001 と衝突しないよう)。
name: next-app-note

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "54332:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"   # S3 API
      - "9003:9001"   # Web コンソール
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/app-note &&
        mc anonymous set download local/app-note
      "
    restart: "no"

  stripe-mock:
    image: stripe/stripe-mock:latest
    restart: unless-stopped
    ports:
      - "12111:12111"   # HTTP API
      - "12112:12112"   # HTTPS API (optional)

volumes:
  pgdata:
  miniodata:
